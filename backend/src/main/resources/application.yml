spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dating_request?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: never

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-value}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
